name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The build runs npm packages and downloads, so it gets no write token.
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Only go and node are installed; the build needs no other tool.
      MISE_EXEC_AUTO_INSTALL: "false"
      TAG: ${{ github.ref_name }}
    steps:
      # make gets the version as text, so the tag must be a plain version.
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Tag $TAG is not a version such as v1.2.3 or v1.2.3-rc.1"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go node
      - name: Build the universal app
        run: make app-universal VERSION="${TAG#v}"
      - name: Check the app
        run: |
          ditto -x -k "desktop/dist/YarGPT-${TAG#v}-universal-mac.zip" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/YarGPT.app"
          codesign --verify --deep --strict "$app"
          for binary in "$app/Contents/MacOS/YarGPT" "$app/Contents/Resources/yargpt"; do
            archs=" $(lipo -archs "$binary") "
            [[ "$archs" == *" arm64 "* && "$archs" == *" x86_64 "* ]] || { echo "::error::$binary has the architectures$archs, not arm64 and x86_64"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: desktop/dist/YarGPT-*-universal-mac.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" YarGPT-*-universal-mac.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "YarGPT $TAG" --generate-notes "${prerelease[@]}" \
            --notes "Download YarGPT-${TAG#v}-universal-mac.zip, unzip it, and move YarGPT.app to /Applications. The app has an ad-hoc signature, not an Apple Developer ID, so macOS blocks the downloaded app. Before you open it the first time, run: xattr -dr com.apple.quarantine /Applications/YarGPT.app"
