name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The build runs npm packages and downloads, so it gets no write token.
  build:
    runs-on: macos-latest
    # Notarization can wait several minutes for Apple.
    timeout-minutes: 45
    env:
      # Only go and node are installed; the build needs no other tool.
      MISE_EXEC_AUTO_INSTALL: "false"
      TAG: ${{ github.ref_name }}
    steps:
      # make gets the version as text, so the tag must be a plain version.
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Tag $TAG is not a version such as v1.2.3 or v1.2.3-rc.1"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go node
      - name: Build the UI and the server, and install the desktop packages
        run: make app-universal-deps
      # Only this step gets the signing secrets, and it installs no packages.
      - name: Sign and notarize the universal app
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || { echo "::error::The secret for $name is not set"; exit 1; }
          done
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          make app-universal-package VERSION="${TAG#v}"
      - name: Check the app
        run: |
          ditto -x -k "desktop/dist/YarGPT-${TAG#v}-universal-mac.zip" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/YarGPT.app"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt" || { echo "::error::Gatekeeper does not accept the app as notarized"; exit 1; }
          xcrun stapler validate "$app"
          for binary in "$app/Contents/MacOS/YarGPT" "$app/Contents/Resources/yargpt"; do
            archs=" $(lipo -archs "$binary") "
            [[ "$archs" == *" arm64 "* && "$archs" == *" x86_64 "* ]] || { echo "::error::$binary has the architectures$archs, not arm64 and x86_64"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: desktop/dist/YarGPT-*-universal-mac.zip
          if-no-files-found: error
          # The release keeps the zip; the artifact only carries it to the release job.
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
      - name: Publish the zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # yargpt.com links releases/latest/download/YarGPT-universal-mac.zip,
          # so the zip's name must not change between releases.
          mv YarGPT-*-universal-mac.zip YarGPT-universal-mac.zip
          # A release made on GitHub pushes its tag too; it keeps its title and notes.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release upload "$TAG" YarGPT-universal-mac.zip --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" YarGPT-universal-mac.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "YarGPT $TAG" --generate-notes "${prerelease[@]}" \
            --notes "Download YarGPT-universal-mac.zip, unzip it, move YarGPT.app to /Applications, and open it. The app is signed with a Developer ID and notarized by Apple."
