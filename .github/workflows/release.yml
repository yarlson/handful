name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Only go and node are installed; the build needs no other tool.
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go node
      - name: Build the universal app
        env:
          TAG: ${{ github.ref_name }}
        run: make app-universal VERSION="${TAG#v}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" desktop/dist/YarGPT-*-universal-mac.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "YarGPT $TAG" --generate-notes "${prerelease[@]}" \
            --notes "Download YarGPT-${TAG#v}-universal-mac.zip, unzip it, and move YarGPT.app to /Applications. The app has an ad-hoc signature, not an Apple Developer ID, so macOS blocks the downloaded app. Before you open it the first time, run: xattr -dr com.apple.quarantine /Applications/YarGPT.app"
